<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thời khóa biểu Sinh viên - ĐHHP</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">Thời khóa biểu · Sinh viên</div>
    <div class="user-info">
      <span id="userName">Đang tải...</span>
      <button class="btn btn-danger" id="btnLogout" style="padding: 7px 14px; font-size: 13px;">Đăng xuất</button>
    </div>
  </header>

  <div class="container">
    <h2 class="page-title">Thời khóa biểu của tôi</h2>
    <p class="page-desc">Xem lịch học theo học kỳ của các lớp bạn được gán.</p>

    <div class="toolbar">
      <label for="semesterSelect">Học kỳ:</label>
      <select id="semesterSelect"></select>
      <button class="btn btn-primary" id="btnLoad" style="width: auto; padding: 8px 18px;">Xem lịch</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Thứ</th>
            <th>Giờ học</th>
            <th>Mã môn</th>
            <th>Tên môn học</th>
            <th>Lớp HP</th>
            <th>Phòng</th>
            <th>Giảng viên</th>
          </tr>
        </thead>
        <tbody id="scheduleBody">
          <tr><td colspan="7" class="empty-state">Đang tải dữ liệu...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    initPage('student');
  </script>
</body>
</html>
